<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17181a">
  <title>Lorah • Financeiro</title>
  <link rel="icon" type="image/svg+xml" href="assets/lorah-favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="mobile-header">
    <button class="mobile-profile-btn" id="mobileProfileBtn" aria-label="Abrir perfil"><span>LO</span></button>
    <img src="assets/lorah-wordmark.svg" class="mobile-logo" alt="Lorah">
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"/></svg>
    </button>
  </header>

  <div class="mobile-popover profile-popover" id="mobileProfilePopover">
    <button class="mobile-popover-item" id="mobileThemeToggle"><span class="icon">◐</span><span id="mobileThemeLabel">Tema Escuro</span></button>
    <button class="mobile-popover-item danger" id="mobileLogoutButton"><span class="icon">↪</span><span>Sair</span></button>
  </div>
  <div class="mobile-popover menu-popover" id="mobileMenuPopover"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand-rail">
      <button class="avatar ai-avatar" title="Assistente IA"><span>IA</span></button>
      <nav class="rail-nav" id="railNav"></nav>
      <div class="rail-bottom"><button class="avatar user-avatar"><span>LO</span></button></div>
    </div>
    <div class="sidebar-panel">
      <div class="sidebar-top"><div class="logo-wrap"><img src="assets/lorah-wordmark.svg" class="logo-img" alt="Lorah"></div></div>
      <nav class="panel-nav" id="panelNav"></nav>
      <div class="panel-bottom">
        <div class="divider"></div>
        <button class="utility-item" id="importButton"><span class="utility-icon">⇩</span><span>Importar dados</span></button>
        <input id="fileInput" type="file" accept=".xlsx,.xls" hidden>
        <button class="utility-item" id="themeToggle"><span class="utility-icon">◐</span><span id="themeLabel">Tema Escuro</span></button>
        <button class="utility-item danger" id="logoutButton"><span class="utility-icon">↪</span><span>Sair</span></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumbs">início <span>›</span> <span id="breadcrumbPage">visão geral</span></div>
      <button class="filter-button" id="filterButton" type="button" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.1v5.3l-3.6 1.8v-7.1L4 5Z"/></svg>
        <span>Filtrar dados</span>
      </button>
      <div class="filter-panel" id="filterPanel">
        <div class="filter-panel-head">
          <div><strong>Filtrar dados</strong><span>Os filtros afetam todas as análises da página.</span></div>
          <button class="icon-button" id="closeFilter" aria-label="Fechar">×</button>
        </div>
        <div class="filter-grid">
          <label class="field field-wide">
            <span>Período</span>
            <select id="periodPreset">
              <option value="all">Tudo</option>
              <option value="7">Últimos 7 dias</option>
              <option value="15">Últimos 15 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="quarter">Trimestre atual</option>
              <option value="custom">Personalizado</option>
            </select>
          </label>
          <label class="field custom-date"><span>Início</span><input type="date" id="startDate"></label>
          <label class="field custom-date"><span>Fim</span><input type="date" id="endDate"></label>
          <label class="field"><span>Natureza</span><select id="natureFilter"><option value="">Todas</option></select></label>
          <label class="field"><span>Conta</span><select id="accountFilter"><option value="">Todas</option></select></label>
          <label class="field field-wide event-filter-field">
            <span>Evento</span>
            <select id="eventFilter">
              <option value="">Todos os eventos</option>
            </select>
            <small>Ao selecionar um evento, receitas passam a usar a aba Eventos (V) e despesas usam os lançamentos vinculados ao evento.</small>
          </label>
          <label class="field field-wide"><span>Fornecedor / Cliente</span><input id="partyFilter" type="search" placeholder="Buscar nome"></label>
        </div>
        <div class="filter-actions">
          <button class="secondary-button" id="clearFilters">Limpar</button>
          <button class="primary-button" id="applyFilters">Aplicar</button>
        </div>
      </div>
    </header>

    <section class="page-area">
      <div class="data-status" id="dataStatus"></div>
      <div id="pageRoot"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="js/data/storage.js"></script>
<script src="js/analytics/finance-engine.js"></script>
<script src="js/analytics/event-engine.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/filters.js"></script>
<script src="js/pages/overview.js"></script>
<script src="js/pages/dre.js"></script>
<script src="js/pages/events.js"></script>
<script src="js/app.js"></script>
</body>
</html>
