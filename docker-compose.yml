services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lorah
      MYSQL_USER: lorah
      MYSQL_PASSWORD: lorah
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - lorah_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lorah_mysql:
